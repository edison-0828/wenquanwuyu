<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>松间温泉</title>
<style>
:root{color-scheme:light;--ink:#2c3a33;--muted:#637466;--paper:#f6efd8;--line:#c7c5a3;--green:#315d4f;--gold:#d9ad60}
*{box-sizing:border-box}body{margin:0;background:#dce5d1;color:var(--ink);font:14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}button:disabled{opacity:.47;cursor:default}button:focus-visible,canvas:focus-visible{outline:3px solid #cf843b;outline-offset:2px}
main{max-width:720px;margin:auto;min-height:100dvh;background:var(--paper);box-shadow:0 0 48px #25413828}
header{padding:18px 20px 14px;background:#234638;color:#f6edcf;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:"KaiTi",serif;margin:0;font-size:32px;letter-spacing:3px;line-height:1.15}header small{color:#b7c9a8;letter-spacing:2px}header button{min-width:44px;min-height:44px;border:1px solid #729177;background:#35594a;color:#eee6cb;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);background:#fff7df}
.stats button{pointer-events:auto;min-width:0;padding:5px 0;border:0;border-right:1px solid #ded8ba;background:#e7edcc;color:#315d4f}.stats button.active{background:#d2dfaf}.stats button b{font-size:16px}.stats div{padding:8px 4px;text-align:center;border-right:1px solid #ded8ba}.stats div:last-child{border:0}.stats small{display:block;color:var(--muted);font-size:11px}.stats b{font-size:18px;font-variant-numeric:tabular-nums}
.scene{position:relative;background:#adc7a2}.scene canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}
.badge{position:absolute;top:10px;left:12px;background:#25493de8;color:#e8efd4;padding:4px 9px;font-size:11px;border:1px solid #9fbd93;border-radius:4px;pointer-events:none}
.legend{position:absolute;bottom:8px;right:10px;background:#233e35dd;color:#f5edce;padding:4px 8px;font-size:10px;border-radius:4px;pointer-events:none}
.panel{padding:12px 14px 16px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;min-height:42px;background:#e8e4ca;border:1px solid var(--line);border-radius:5px}.tabs .active{background:#335d4f;border-color:#335d4f;color:#fff4d5}
.build-categories{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.build-categories button{flex:1;min-height:36px;padding:3px 6px;border:1px solid #b5bc9b;border-radius:4px;background:#f5efd8;color:#466153;white-space:nowrap}.build-categories button[aria-pressed="true"]{background:#416557;color:#fff1d1;border-color:#416557}
.items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.item{padding:6px 3px;background:#fcf6e2;border:1px solid #c6c5a6;border-radius:5px;min-height:50px}.item span{display:block;color:#69775e;font-size:10px}.item.selected{background:#e1ebcf;border:2px solid #658455}
.note{min-height:48px;padding:8px 1px;color:#495f4b;font-size:12px}.controls{display:flex;gap:8px}.controls button{min-height:46px;border:1px solid #93a080;background:#e7e7cb;border-radius:5px;padding:8px 10px;flex:1}.controls .primary{flex:1.5;background:#315d4f;color:#fff4d5;border-color:#315d4f;font-weight:bold}
.report{border:1px solid #c9c6a5;background:#fff7df;border-radius:6px;padding:10px;margin-bottom:10px;font-size:13px}.report b{color:#315d4f}.row{display:flex;justify-content:space-between;border-bottom:1px dashed #dcd5b6;padding:5px 0;gap:10px}
dialog{max-width:min(410px,calc(100% - 30px));border:2px solid #799075;background:#fff4d8;color:var(--ink);border-radius:8px;padding:20px}dialog::backdrop{background:#172f26a8}dialog h2{margin-top:0}dialog button{min-height:44px;border:1px solid #9cae89;border-radius:4px;background:#e5e9ce;padding:5px 16px}
@media(max-width:380px){header{padding:13px}h1{font-size:27px}.panel{padding:9px}.stats b{font-size:16px}.item{font-size:12px}}

.guest-bubble{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-100%);padding:5px 8px;background:#fff6d9;border:2px solid #536650;box-shadow:2px 2px #32463970;color:#263d32;font-size:12px;font-weight:bold;white-space:nowrap}.guest-bubble::after{content:"";position:absolute;top:100%;left:var(--tail,50%);width:6px;height:6px;background:#fff6d9;border-right:2px solid #536650;border-bottom:2px solid #536650;transform:translate(-50%,-3px) rotate(45deg)}
.land-sign{position:absolute;z-index:3;transform:translate(-50%,-100%);padding:4px 8px;min-height:44px;border:2px solid #785141;border-radius:4px;background:#f2d39d;color:#694333;box-shadow:2px 3px #40564760;white-space:nowrap;font-size:11px;font-weight:bold}
.land-sign strong{display:block;font-size:13px;color:#983f35}
.land-sign::after{content:"";position:absolute;top:100%;left:calc(50% - 2px);width:4px;height:8px;background:#785141}
.map-menu{position:absolute;z-index:2;left:8px;right:8px;bottom:8px;max-height:76%;overflow:auto;padding:8px;background:#fbf4ddf5;border:1px solid #788c6e;border-radius:7px;box-shadow:0 3px 12px #24362c55}
.map-menu.top{top:43px;bottom:auto}.map-menu[hidden]{display:none}
.map-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.map-head button,.map-confirm{min-height:38px;background:#315d4f;color:#fff4d5;border:1px solid #315d4f;border-radius:5px;padding:4px 10px}
.map-menu p{margin:5px 0;font-size:12px}.map-menu .items{gap:4px}.map-menu .item{min-height:40px;font-size:11px;padding:3px 1px}
.map-confirm{margin-top:5px;width:100%}.note:empty{display:none}

html,body{height:100%;overflow:hidden}main.scene{width:100%;max-width:none;height:100dvh;min-height:0;margin:0;overflow:hidden;box-shadow:none}
.scene canvas{position:absolute;inset:0;width:100%;height:100%}
.map-hud{position:absolute;z-index:1;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;max-width:520px;margin:auto;pointer-events:none}
.map-title{display:flex;align-items:center;gap:8px;margin-bottom:5px;color:#fff6db}
.map-title strong,.map-title button{background:#25493dee;border:1px solid #9fbd93;border-radius:5px;padding:5px 8px}
.map-title button{margin-left:auto;min-width:36px;min-height:36px;color:#fff6db;pointer-events:auto}
.map-title .badge{position:static}
.stats{border:1px solid #b8c3a0;border-radius:6px;background:#fff7dfee;overflow:hidden}
.stats div{padding:3px 4px}.stats b{font-size:15px}
.map-dock{position:absolute;z-index:2;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-width:520px;margin:auto;pointer-events:none}
.map-dock .controls button{min-width:0;padding-inline:4px;white-space:nowrap}
.goal{padding:9px 0;border-bottom:1px dashed #dcd5b6}.goal:last-child{border-bottom:0}.goal p{margin:4px 0;color:#596b53}.goal .row{align-items:center;border-bottom:0;padding:3px 0}.goal button{min-height:38px;border:1px solid #a68048;border-radius:5px;background:#f4d88a;color:#5b422c;padding:4px 9px}
.map-dock button{pointer-events:auto;box-shadow:0 2px 4px #28443d44}
.map-dock .note{display:table;min-height:0;max-width:100%;margin:0 auto 5px;padding:4px 7px;border-radius:4px;background:#253f35df;color:#fff6d9}
.map-dock .note:empty{display:none}
.map-menu,.map-menu.top,.map-sheet{position:absolute;z-index:4;left:8px;right:8px;top:auto;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 84px);max-width:520px;max-height:calc(100% - 200px);margin:auto;overflow:auto}
.map-sheet[hidden]{display:none}.map-sheet .report{margin:0;box-shadow:0 4px 14px #24362c55}.sheet-close{float:right;min-height:36px;border:1px solid #8d9e7e;border-radius:4px;background:#e6ebd1;padding:3px 9px}
@media(max-height:460px){.map-hud{max-width:370px}.map-dock .note{display:none}.map-menu,.map-menu.top,.map-sheet{bottom:59px;max-height:calc(100% - 150px)}}

.map-camera{display:flex;justify-content:flex-end;gap:5px;margin-top:6px;pointer-events:none}
.map-camera button{pointer-events:auto;min-height:34px;padding:4px 9px;background:#fff4dbe8;border:1px solid #91a080;border-radius:5px;color:#39584a}
.scene canvas{cursor:grab}.scene canvas.dragging{cursor:grabbing}
</style>
</head>
<body>
<main class="scene">
<canvas id="map" width="480" height="430" tabindex="0" aria-label="旅馆地图。点地块操作，也可用方向键选地块"></canvas>
<div class="map-hud">
  <div class="map-title"><strong>松间温泉</strong><span id="badge" class="badge"></span><button id="help" aria-label="玩法说明">？</button></div>
  <div class="stats"><div><small>营业日</small><b id="day"></b></div><div><small>资金</small><b id="cash"></b></div><button type="button" data-tab="environment" aria-label="查看环境评分"><small>环境评分</small><b id="environment"></b></button><div><small>入住上限</small><b id="capacity"></b></div></div>
  <div class="map-camera"><button id="street-camera" hidden>温泉街</button><button id="camera-toggle" aria-label="切换地图近景和全景">全景</button></div>
</div>
<button class="land-sign" id="land-sign" type="button" hidden><strong>土地出售</strong><span id="land-name"></span></button>
<div id="guest-bubble" class="guest-bubble" hidden></div>
<section id="map-menu" class="map-menu" aria-label="地图地块操作" hidden></section>
<div class="map-dock">
  <div id="note" class="note" aria-live="polite"></div>
  <div class="controls"><button data-tab="report">账簿</button><button id="open" class="primary">开始营业</button></div>
</div>
<section id="content" class="map-sheet" aria-label="旅馆经营面板" hidden></section>
<dialog id="manual"><h2>旅馆手册</h2><p>点地图上的空地，在图上选择设施并确认建造。点已有设施可以查看详情或拆除。客人从下方入口沿石板路行走，只有接到入口的设施才会营业。点地图上的「土地出售」木牌可以购地。</p><p>客房决定接待上限。温泉和餐室有每日容量，满了就有客人用不上。松树邻接温泉、石灯邻接客房会提高舒适度。</p><p>每晚结算收入和维护费。点击顶部环境评分可查看庭园加分、客流加成和稀有赏景客的到访概率。客房等级越高，住宿费越高。旅行团预约会在开业前弹出，可以接单或略过。游戏会自动保存在当前浏览器，离开后回来可以接着当天的营业。</p><button id="close-help">明白了</button></dialog>
<dialog id="tour-offer"><h2>山间奇遇 · 旅行团预约</h2>
  <p id="tour-offer-detail"></p>
  <div class="controls"><button id="skip-tour">略过</button><button id="accept-tour" class="primary">接下预约</button></div>
</dialog>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
const BASE_WIDTH = 8, BASE_HEIGHT = 7, entrance = [3, 6], SAVE = "pine-onsen-v01";
const items = {
  path:{name:"石板路", cost:35, keep:0, detail:"连接入口和设施。"},
  water:{name:"水路",cost:140,keep:2,detail:"相邻水路会连成池塘，每格环境 +2。建好后可点水面放养鱼类，游客走陆路。"},
  cobble:{name:"鹅卵石路",cost:45,keep:0,detail:"圆石庭园小径，可与其他道路相连。"},
  boardwalk:{name:"木栈道",cost:55,keep:0,detail:"暖色木板步道，可与其他道路相连。"},
  room:{name:"榻榻米客房", cost:450, keep:35, detail:"每日接待 2 位客人，住宿收入 145／人。"},
  bath:{name:"露天温泉", cost:680, keep:50, detail:"每日可供 4 位客人泡汤，收入 75／人。旁边种松更舒适。"},
  food:{name:"山味餐室", cost:380, keep:30, detail:"每日供应 3 份晚饭，收入 55／份。"},
  shop:{name:"土产铺", cost:310, keep:20, detail:"每日可服务 4 位客人，收入 35／人。"},
  gifts:{name:"纪念品商店",cost:780,keep:35,detail:"接通石板路后，客人会来买旅行纪念品。一级每日接待 4 人。"},
  cinema:{name:"山间小影院",cost:1200,keep:65,detail:"接通石板路后，客人可以在泡汤之余看电影。一级每日接待 5 人。"},
  dango:{name:"炭火团子屋",cost:950,keep:45,detail:"烤团子小摊。接通道路后，普通客消费 45 文。"},
  teaHouse:{name:"抹茶茶寮",cost:1600,keep:70,detail:"招待散步游客喝茶。接通道路后，普通客消费 80 文。"},
  arcade:{name:"祭典游艺馆",cost:2400,keep:110,detail:"射靶和套圈摊。接通道路后，普通客消费 115 文。"},
  pavilion:{name:"花见休憩亭",cost:1200,keep:16,detail:"带长椅的赏花亭，每级增加 20 点环境评分。"},
  pine:{name:"庭园松", cost:100, keep:3, detail:"与温泉上下左右相邻时，提高泡汤体验。"},
  lamp:{name:"石灯笼", cost:80, keep:2, detail:"与客房上下左右相邻时，提高住宿体验。"},
  pond:{name:"锦鲤池", cost:155, keep:4, detail:"与餐室上下左右相邻时，提高用餐体验。"},
  cherry:{name:"樱花树",cost:240,keep:5,detail:"每级增加 9 点环境评分。"},
  torii:{name:"朱红鸟居",cost:360,keep:6,detail:"每级增加 11 点环境评分。"},
  pagoda:{name:"庭园石塔",cost:520,keep:8,detail:"每级增加 14 点环境评分。"}
};
const roadTypes=["path","cobble","boardwalk"];
const isRoad=type=>roadTypes.includes(type);
const facilityStyles={
  original:{name:"松间原木"},
  sakura:{name:"樱坂朱瓦",wall:"#efc6ae",shade:"#c09582",roof:"#a85f67",light:"#d59290",cloth:"#994d62"},
  moon:{name:"月见黛瓦",wall:"#e3dcca",shade:"#aaa8a3",roof:"#4c657e",light:"#839bb0",cloth:"#475d7b"}
};
const facadeCost=120;
const streetServices={
  dango:{fee:45,comment:"刚烤好的团子真香。"},
  teaHouse:{fee:80,comment:"坐下来喝杯抹茶，歇歇脚。"},
  arcade:{fee:115,comment:"在游艺馆赢了个小奖品！"}
};
const animals={
  koi:{name:"红白锦鲤",cost:280,score:12,color:"#e79a70",accent:"#fff2cb",hosts:["water","pond"]},
  goldfish:{name:"金鱼",cost:180,score:8,color:"#efbe63",accent:"#ffdfa0",hosts:["water","pond"]},
  sparrow:{name:"山雀",cost:160,score:7,color:"#8b7f5e",accent:"#f0d7a3",hosts:["pine","cherry"]},
  whiteEye:{name:"绣眼鸟",cost:320,score:14,color:"#8eaa66",accent:"#f9e8b1",hosts:["pine","cherry"]}
};
const buildCategories=[
  {id:"all",name:"全部",items:Object.keys(items)},
  {id:"roads",name:"道路",items:[...roadTypes,"water"]},
  {id:"lodging",name:"住宿",items:["room"]},
  {id:"services",name:"服务",items:["bath","food","shop","gifts","cinema"]},
  {id:"street",name:"温泉街",items:[...Object.keys(streetServices),"gifts","cinema","pavilion"]},
  {id:"garden",name:"庭园",items:["pine","lamp","pond","cherry","torii","pagoda","pavilion"]},
  {id:"animals",name:"动物",items:[]}
];
function fresh() {
  const grid = Array.from({length:BASE_HEIGHT}, () => Array(BASE_WIDTH).fill(""));
  for (let y=1; y<BASE_HEIGHT; y++) grid[y][3] = "path";
  for (const [x,y,k] of [[2,4,"room"],[4,4,"room"],[4,2,"bath"],[2,2,"food"],[5,2,"pine"],[1,2,"pond"],[2,5,"lamp"]]) grid[y][x] = k;
  return {grid, cash:1250, day:1, history:[], eastOpen:false};
}
let state;
try { state = JSON.parse(localStorage.getItem(SAVE)); } catch {}
if (!state || !Array.isArray(state.grid)||state.grid.length<BASE_HEIGHT) state = fresh();
state.eastOpen ??= state.grid.some(row => row.slice(6).some(Boolean));
state.upgrades ??= {};
state.animals ??= {};
state.facilityStyles ??= state.roomStyles ?? {};
delete state.roomStyles;
state.roomExtensions ??= {};
const landSales=[
  {id:"eastOpen",name:"东坡庭园",width:2,cost:900,environment:40,existing:true},
  {id:"ridgeOpen",name:"松岭外坡",width:3,cost:1800},
  {id:"sakura",name:"樱坂庭园",width:4,cost:6000},
  {id:"moon",name:"月见高台",width:5,cost:12000},
  {id:"riverside",name:"河畔温泉街",rows:3,cost:16000},
  {id:"southGarden",name:"南谷花见苑",rows:3,cost:24000},
  {id:"acrossRiver",name:"桥头商街 · 一期",start:13,rows:3,columns:8,cost:36000},
  {id:"riverMarket",name:"樱灯市集 · 二期",start:16,rows:4,columns:10,cost:48000},
  {id:"riverTheater",name:"松影广场 · 三期",start:20,rows:4,columns:12,cost:64000},
  {id:"riverRetreat",name:"月隐长街 · 四期",start:24,rows:4,columns:14,cost:85000},
  {id:"riverEast",name:"东岸花廊",start:28,columns:19,infill:true,cost:98000},
  {id:"riverPines",name:"松风町",start:28,rows:6,columns:19,cost:125000},
  {id:"riverMoon",name:"月湾别苑",start:34,rows:6,columns:19,cost:160000}
];
let W=state.grid[0].length,H=state.grid.length;
const bankStart=13, bankLeft=1, bankOffset=[-65,155];
const bankDistricts=landSales.filter(area=>area.columns&&area.rows);
const bankDistrictAt=y=>bankDistricts.find(area=>y>=area.start&&y<area.start+area.rows);
const mainlandHeight=()=>Math.min(H,bankStart);
const bankColumns=y=>state.riverEast&&y<28?19:bankDistrictAt(y)?.columns||0;
const landSize=area=>area.infill?
  bankDistricts.filter(district=>district.start<area.start).reduce((sum,district)=>sum+district.rows*(area.columns-district.columns),0):
  area.rows?area.rows*(area.columns||W):area.width*H;
const nextLand=()=>landSales.find(area=>!state[area.id]);
const bridgeConnected=area=>roadRoutes().has(key(entrance[0],area.start-1));
const canBuyLand=(area,score)=>mode==="ready"&&state.cash>=area.cost&&score>=(area.environment||0)&&
  (!area.columns||bridgeConnected(area));
const locked = x => x >= 6 && !state.eastOpen;
const guestTypes = {
  bath: {name:"泡汤客"},
  food: {name:"尝鲜客"},
  garden: {name:"赏景客（稀有）"},
  group: {name:"旅行团客"}
};
let mode = state.history[0]?.day === state.day ? "closed" : "ready";
const checkpoint=state.businessCheckpoint;
const resumable=mode==="ready"&&checkpoint?.day===state.day&&
  Number.isFinite(checkpoint.clock)&&checkpoint.clock>=0&&checkpoint.run?.guests?.length>0;
let tab = "", kind = "", cursor = null, buildCategory="all";
let clock=resumable?checkpoint.clock:0;
let run=resumable?checkpoint.run:null;
if(resumable)mode="running";
const inside=(x,y)=>x>=0&&x<W&&y>=0&&y<H&&(y<bankStart||x>=bankLeft&&x<bankLeft+bankColumns(y));
const bridgeRoad=(x,y)=>state.acrossRiver&&x===entrance[0]&&(y===bankStart-1||y===bankStart);
const neighbors = (x,y) => [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>inside(a,b)&&((b<bankStart)===(y<bankStart)||a===entrance[0]&&x===entrance[0]));
// Keep the original tile IDs so upgraded and expanded rooms survive a wider map.
const key = (x,y) => y>=BASE_HEIGHT?1000+y*32+x:
  x<BASE_WIDTH?y*BASE_WIDTH+x:BASE_WIDTH*BASE_HEIGHT+(x-BASE_WIDTH)*BASE_HEIGHT+y;
const capacityByType={room:[2,3,4,5,6,8],bath:[4,6,8,10,12,15],food:[3,5,7,9,11,14],shop:[4,6,8,10,12,15],gifts:[4,6,8,10,13,16],cinema:[5,7,10,13,16,20],dango:[5,7,9,12,15,18],teaHouse:[4,6,8,11,14,18],arcade:[5,8,11,14,18,22]};
const tierNames=["初建","整修","雅致","精品","名物","地标"];
const tierColors=["#c49d68","#bf905c","#668f83","#7286a5","#a67385","#ca9a53"];
const sceneryPoints={pine:5,lamp:4,pond:6,cherry:9,torii:11,pagoda:14,pavilion:20};
const sceneryScore=(type,level)=>sceneryPoints[type]*level;
const canUpgrade=type=>Boolean(capacityByType[type]||sceneryPoints[type]);
const tierDetails={
  dango:["团子木摊","暖帘团子屋","瓦檐团子屋","双层甜点铺","围廊团子屋","金脊甜点馆"],

const facilityLevel=(x,y)=>{
  const saved=state.upgrades[key(x,y)];
  return saved===true?2:Number.isInteger(saved)?Math.max(1,Math.min(tierNames.length,saved)):1;
};
const upgradeCost=(type,level)=>Math.ceil(items[type].cost*(60+(level-1)*25)/100);
const extraMaintenance=(type,level)=>Math.ceil(items[type].keep*.4)*(level-1);
const roomExpansion={cost:320,keep:18,capacity:2};
const coords=index=>index>=1000?[(index-1000)%32,Math.floor((index-1000)/32)]:
  index<BASE_WIDTH*BASE_HEIGHT?[index%BASE_WIDTH,Math.floor(index/BASE_WIDTH)]:
  [Math.floor(index/BASE_HEIGHT),index%BASE_HEIGHT];
const extensionAt=(x,y)=>Object.keys(state.roomExtensions).find(index=>state.roomExtensions[index]===key(x,y));
const canExtendTo=(x,y)=>!locked(x)&&!state.grid[y][x]&&state.roomExtensions[key(x,y)]===undefined;
const capacityAt=(type,x,y)=>capacityByType[type][facilityLevel(x,y)-1]+
  (type==="room"&&extensionAt(x,y)!==undefined?roomExpansion.capacity:0);
function roadRoutes(){
  const routes = new Map([[key(...entrance), [entrance]]]);
  const queue = [entrance];
  for (let i=0; i<queue.length; i++) {
    const [x,y] = queue[i];
    for (const [a,b] of neighbors(x,y)) {
      if (!isRoad(state.grid[b][a]) || routes.has(key(a,b))) continue;
      routes.set(key(a,b), [...routes.get(key(x,y)), [a,b]]);
      queue.push([a,b]);
    }
  }
  return routes;
}
function facilities(routes=roadRoutes()){
  const found=Object.fromEntries(Object.keys(capacityByType).map(type=>[type,[]]));
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    const type=state.grid[y][x];
    if (!(type in found)) continue;
    const extension=type==="room"?extensionAt(x,y):undefined;
    const near=neighbors(x,y);
    if(extension!==undefined)near.push(...neighbors(...coords(extension)));
    const access=near.map(([a,b])=>routes.get(key(a,b))).filter(Boolean).sort((a,b)=>a.length-b.length)[0];
    if (!access) continue;
    const bonusType={room:"lamp",bath:"pine",food:"pond"}[type];
    found[type].push({x,y,route:access, capacity:capacityAt(type,x,y), bonus:near.some(([a,b])=>state.grid[b][a]===bonusType)});
  }
  return found;
}
const sceneryCombos={room:5,bath:6,food:4};
function environment(f){
  const plants=state.grid.reduce((sum,row,y)=>sum+row.reduce((subtotal,type,x)=>
    subtotal+(type==="water"?2:sceneryPoints[type]?sceneryScore(type,facilityLevel(x,y)):0),0),0);
  const combos=Object.entries(sceneryCombos).reduce((sum,[type,points])=>
    sum+f[type].filter(facility=>facility.bonus).length*points,0);
  const animalScore=Object.entries(state.animals).reduce((sum,[index,id])=>{
    const [x,y]=coords(index);
    const animal=animals[id];
    return sum+(animal?.hosts.includes(state.grid[y]?.[x])?animal.score:0);
  },0);
  const score=plants+combos+animalScore;
  return {plants,combos,animalScore,score,extraVisitors:Math.floor(score/25),rareChance:2+98*score/(250+score)};
}
const innCapacity=available=>available.room.reduce((sum,room)=>sum+room.capacity,0);
const lodgingFee=level=>145+25*(level-1);
const businessDuration=30000;
const guestWalkSpeed=52;
const tour={size:3,multiplier:2,duration:20000};
const hasTourOffer=()=>state.day===2||(state.day>2&&state.day%4===0);
const tourBooked=()=>state.tourDay===state.day;
function showTourOffer(){
  if(mode!=="ready"||!hasTourOffer())return;
  const booked=tourBooked();
  if(!booked&&state.tourSeenDay===state.day)return;
  const enough=innCapacity(facilities())>=tour.size;
  if(booked&&enough)return;
  const dialog=$("tour-offer");
  if(dialog.open)return;
  $("tour-offer-detail").textContent=booked?
    "已接下预约，但目前床位不足。可以取消预约，或关闭弹窗后补足床位。":
    "有 "+tour.size+" 位旅客想预订客房。接单后团客优先入住，前 20 秒为团客时段，全日营业约 30 秒，消费按普通客人的 "+tour.multiplier+" 倍结算。"+
    (enough?"":"目前缺少已通路的客房床位。");
  $("skip-tour").textContent=booked?"取消预约":"略过";
  $("accept-tour").textContent=booked?"继续扩建":"接下预约";
  $("accept-tour").disabled=!booked&&!enough;
  dialog.showModal();
}
function resolveTourOffer(accept){
  if(!$("tour-offer").open)return;
  if(accept&&tourBooked()){
    $("tour-offer").close();
    return;
  }
  if(accept&&innCapacity(facilities())<tour.size)return;
  state.tourSeenDay=state.day;
  if(accept)state.tourDay=state.day;
  else delete state.tourDay;
  save();
  $("tour-offer").close();
  note(accept?"已为旅行团预留 "+tour.size+" 个床位，开门后到店。":"本次旅行团预约已略过。");
}
$("skip-tour").onclick=()=>resolveTourOffer(false);
$("accept-tour").onclick=()=>resolveTourOffer(true);
$("tour-offer").addEventListener("cancel",event=>{
  if(tourBooked())return;
  event.preventDefault();
  resolveTourOffer(false);
});
function businessBadge(){
  if(run.tour&&clock<tour.duration)return "旅行团到店 · "+Math.ceil((tour.duration-clock)/1000)+" 秒";
  return "营业中 · "+Math.ceil((businessDuration-clock)/1000)+" 秒";
}

}

}

const number = n => n.toLocaleString("zh-CN");
function note(message){
  const feedback=$("map-feedback");
  if(feedback && !$("map-menu").hidden) feedback.textContent=message;
  else $("note").textContent=message;
}
function upgradePlan(type,level,limit){
  let cost=0, target=level;
  while(target<limit){
    const nextCost=upgradeCost(type,target);
    if(cost+nextCost>state.cash)break;
    cost+=nextCost;
    target++;
  }
  return {cost,target};
}

function closeMapMenu(){cursor=null;kind="";renderMapMenu()}
$("map-menu").addEventListener("click",e=>{
  const button=e.target.closest("button");
  if(!button)return;
  if(button.id==="map-close")closeMapMenu();
  if(button.id==="map-expand"){closeMapMenu();tab="land";renderPanel()}
  if(button.dataset.category){buildCategory=button.dataset.category;kind="";renderMapMenu()}
  if(button.dataset.animal&&cursor&&mode==="ready"){
    const [x,y]=cursor, index=key(x,y), id=button.dataset.animal;
    const animal=animals[id];
    if(!animal?.hosts.includes(state.grid[y][x])||state.animals[index]||state.cash<animal.cost)return;
    state.animals[index]=id;
    state.cash-=animal.cost;
    save();renderPanel();renderMapMenu();
    note(animal.name+"已安家，环境 +"+animal.score+" 分。");
  }
  if(button.dataset.roadStyle){kind=button.dataset.roadStyle;place()}
  if(button.dataset.facade&&mode==="ready"&&cursor){
    const [x,y]=cursor, id=button.dataset.facade, tileId=key(x,y);
    if(!capacityByType[state.grid[y][x]]||!Object.hasOwn(facilityStyles,id)||(state.facilityStyles[tileId]||"original")===id||state.cash<facadeCost)return;
    state.facilityStyles[tileId]=id;
    state.cash-=facadeCost;
    save();renderPanel();renderMapMenu();
    note("已更换"+items[state.grid[y][x]].name+"的外观。");
  }
  if(button.dataset.kind){kind=button.dataset.kind;renderMapMenu()}
  if(button.id==="map-place")place();
  if(button.id==="map-remove"){kind="remove";place()}
  if(button.id==="map-upgrade")upgradeFacility(false);
  if(button.id==="map-upgrade-all")upgradeFacility(true);
  if(button.id==="map-room-expand"){
    kind=kind==="extend-room"?"":"extend-room";
    renderMapMenu();
  }
});
function upgradeFacility(all){
  if(mode!=="ready"||!cursor)return;
  const [x,y]=cursor, type=state.grid[y][x];
  const level=facilityLevel(x,y);
  if(!canUpgrade(type)||level>=tierNames.length||locked(x))return;
  const {cost,target}=upgradePlan(type,level,all?tierNames.length:level+1);
  if(target===level)return;
  state.cash-=cost;
  state.upgrades[key(x,y)]=target;
  save();renderPanel();renderMapMenu();
  note("已升至 "+target+" 级，换上"+tierDetails[type][target-1]+"。共花费 "+number(cost)+" 文。");
}

function approachRoute(routes){
  const [x,y]=entrance;
  const edge=[x,mainlandHeight()-1];
  const exit=routes.get(key(...edge));
  if(!exit)return [entrance];
  const distance=state.acrossRiver ? .9:H===BASE_HEIGHT?1.8:1.5;

function guestRoute(stops,approach,bath){
  const route=[...approach];
  let previous=[entrance], soak=null;
  for(const stop of stops){
    const next=stop.route;
    let shared=0;
    while(shared<Math.min(previous.length,next.length)&&previous[shared]===next[shared])shared++;
    const [px,py]=next.at(-1);
    const doorstep=[(px+stop.x)/2,(py+stop.y)/2];
    route.push(...previous.slice(shared-1,-1).reverse(),...next.slice(shared),doorstep);
    if(stop===bath){
      const start=route.length;
      for(let i=0;i<=7;i++)route.push([stop.x,stop.y]);
      soak={x:stop.x,y:stop.y,start,end:route.length-1};
      route.push(doorstep);
    }
    route.push([px,py]);
    previous=next;
  }
  route.push(...previous.slice(0,-1).reverse(),...approach.slice(0,-1).reverse());
  return {route,soak};

      food.bonus?"吃完饭还能赏鱼，真好。":"泡汤挺舒服，想再看些庭园景色。";
    const {route,soak}=guestRoute([room,bath,food,shop,gifts,cinema,...streetStops.map(([id])=>slots[id][i])].filter(Boolean),approach,bath);
    const baseFee=lodgingFee(facilityLevel(room.x,room.y))+(bath?75:0)+(food?55:0)+(shop?35:0);

function walkingPoint(route,phase,direction=1){

  const points=routeSegment(route[index],route[index+1]);
  const lengths=points.slice(1).map(([x,y],i)=>Math.hypot(x-points[i][0],y-points[i][1]));
  let distance=(t-index)*lengths.reduce((sum,length)=>sum+length,0);

  while(segment<lengths.length-1&&distance>lengths[segment])distance-=lengths[segment++];
  const [x,y]=points[segment], [a,b]=points[segment+1];

  return [x+(a-x)*progress,y+(b-y)*progress,(a-x)*direction<0?-1:1,(b-y)*direction<0];
}
const routeTimings=new WeakMap();
function walkingPhase(route,elapsed){

    times=[0];
    for(let i=1;i<route.length;i++){
      const points=routeSegment(route[i-1],route[i]);
      const length=points.slice(1).reduce((sum,[x,y],j)=>sum+Math.hypot(x-points[j][0],y-points[j][1]),0);
      times.push(times[i-1]+(length?length*1000/guestWalkSpeed:260));
    }
    routeTimings.set(route,times);
  }
  if(elapsed<0||elapsed>times.at(-1))return null;
  let lo=0,hi=times.length-1;
  while(hi-lo>1){
    const mid=Math.floor((lo+hi)/2);
    if(times[mid]<=elapsed)lo=mid;
    else hi=mid;
  }
  return (lo+(elapsed-times[lo])/(times[hi]-times[lo]))/(times.length-1);
}

    const count=group?tour.size:run.guests.length-(run.tour?tour.size:0);
    const delay=Math.min(6000,duration*.27)*index/Math.max(1,count-1);
    const t=walkingPhase(g.route,clock-offset-delay);
    if(t===null)return;
    const point=t*(g.route.length-1);
    if(g.soak&&point>=g.soak.start&&point<=g.soak.end){
      const {x:bx,y:by}=g.soak, poolId=key(bx,by);
      const [cx,cy]=pos(bx,by);
      const bathers=bathersByPool.get(poolId)||[];
      const seat=i%12;
      bathers.push({x:cx+(seat%4-1.5)*7,y:cy+Math.floor(seat/4)*3-4,type:g.type,index:i});
      bathersByPool.set(poolId,bathers);
      return;
    }
    const [x,y,facing,back]=walkingPoint(g.route,t);
    if(t>=.73)review={x,y,guest:g};
    layers.push({y,paint:()=>{
      if(g.type==="garden"){
        const glow=.24+.10*Math.sin(sceneryTime/230);
        ctx.globalAlpha=glow;
        diamond(x,y-8,13,17,"#ffd666");
        diamond(x,y-9,9,15,"#ffed9d");
        ctx.globalAlpha=1;
        for(let i=0;i<4;i++){
          const angle=sceneryTime/460+i*Math.PI/2;
          rect(x+Math.cos(angle)*12,y-10+Math.sin(angle)*11,2,2,i%2?"#fff0ae":"#f8c553");
        }
      }
      person(x,y,g.type,stride+i,facing,back);
      if(g.type==="garden"){
        rect(x-1,y-32,3,7,"#e8b34a");
        rect(x-3,y-30,7,3,"#e8b34a");
        rect(x,y-29,1,1,"#fff5bf");
      }
    }});
  });
  if(mode!=="running")walkingRoutes.slice(0,3).forEach((route,i)=>{
    const t=(sceneryTime/(6100+i*900)+i*.29)%1;
    const [x,y,facing,back]=walkingPoint(route,t<.5?t*2:(1-t)*2,t<.5?1:-1);
    layers.push({y,paint:()=>person(x+(i%2?3:-3),y+i%2,i===0?"staff":i===1?"food":"bath",stride+i,facing,back)});
  });
  layers.sort((a,b)=>a.y-b.y).forEach(layer=>layer.paint());
  if(state.acrossRiver){
    const evening=mode==="closed"||mode==="running"&&clock>=18000;
    for(const area of bankDistricts.filter(area=>state[area.id])){
      for(const [x,y] of [[bankLeft,area.start+1],[bankLeft+area.columns-1,area.start+1]]){
        const [px,py]=pos(x,y);
        if(evening){
          diamond(px+9,py-12,15,8,"#ffd28640");
          if(area.start===bankStart)for(let i=0;i<4;i++)rect(px+23+i*2,py-38+i*2,6-i,1,"#f8cc855e");
        }
        resortLantern(px+9,py-1);
      }
    }
  }
  ctx.restore();
  showGuestBubble(review);
}
let drag=null, suppressClick=false;
canvas.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,panX,panY,moved:false};
  suppressClick=false;
});
canvas.addEventListener("pointermove",e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<6)return;
  if(!drag.moved){
    drag.moved=true;
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("dragging");
    closeMapMenu();
  }
  const r=canvas.getBoundingClientRect();
  const horizontalReach=320+Math.max(0,W-BASE_WIDTH)*25*mapScale;
  panX=Math.max(-horizontalReach,Math.min(320+((H-BASE_HEIGHT)*30+(state.acrossRiver?65:0))*mapScale,drag.panX+dx*canvas.width/r.width));
  panY=Math.max(-235-(Math.max(0,W-BASE_WIDTH+H-BASE_HEIGHT)*14+(state.acrossRiver?155:0))*mapScale,Math.min(235,drag.panY+dy*canvas.height/r.height));
  updateCamera();
});
function endDrag(e){
  if(!drag||drag.id!==e.pointerId)return;
  suppressClick=drag.moved;
  drag=null;
  canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup",endDrag);
canvas.addEventListener("pointercancel",endDrag);
canvas.addEventListener("click",e=>{
  if(suppressClick){suppressClick=false;return}
  const r=canvas.getBoundingClientRect(), a=(((e.clientX-r.left)*canvas.width/r.width-viewX-mapOffsetX)/mapScale-239)/25,b=(((e.clientY-r.top)*canvas.height/r.height-viewY-mapOffsetY)/mapScale-65)/14;
  const x=a*25+239,y=b*14+65;
  if(state.acrossRiver){
    const da=(x-bankOffset[0]-239)/25, db=(y-bankOffset[1]-65)/14;
    const bx=Math.round((db+da)/2), by=Math.round((db-da)/2);
    if(by>=bankStart&&inside(bx,by)){select(bx,by);return}
  }
  const tx=Math.round((b+a)/2),ty=Math.round((b-a)/2);
  if(ty<bankStart)select(tx,ty);
  else closeMapMenu();
});
canvas.addEventListener("keydown",e=>{
  const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(d){
    e.preventDefault();
    const [x,y]=cursor||entrance;
    const [dx,dy]=d, nx=x+dx, ny=y+dy;
    const sameRoom=inside(nx,ny)&&state.roomExtensions[key(nx,ny)]===key(x,y);
    select(sameRoom?nx+dx:nx,sameRoom?ny+dy:ny);
  }
  else if(e.key==="Enter"){e.preventDefault();place()}
  else if(e.key==="Escape"){closeMapMenu();tab="";renderPanel()}
});
let last=performance.now(), badgeTick=clock;
function advance(ms){
  sceneryTime += ms;
  if(mode==="running"){
    clock+=ms;
    if(clock>=businessDuration)finish();
    else{
      if(clock-badgeTick>160){$("badge").textContent=businessBadge();badgeTick=clock}
      if(clock-(state.businessCheckpoint?.clock??0)>=2000)saveBusiness();
    }
  }
  draw();
}
window.advanceTime=ms=>advance(Math.max(0,ms));
window.render_game_to_text=()=>JSON.stringify({mode,day:state.day,cash:state.cash,eastOpen:state.eastOpen,ridgeOpen:Boolean(state.ridgeOpen),districts:landSales.slice(2).filter(area=>state[area.id]).map(area=>area.id),roomExtensions:state.roomExtensions,grid:state.grid,cursor,kind,lastReport:state.history[0]||null});
function frame(now){advance(Math.max(0,Math.min(70,now-last)));last=now;requestAnimationFrame(frame)}
note(mode==="running"?"继续营业中。":mode==="closed"?"今日账目已保存。可以查看账簿，再准备下一日。":nextLand()?"拖动看旅馆 · 点售地木牌扩建":"拖动看旅馆 · 点地块操作");
refreshWalkers();renderPanel();showTourOffer();requestAnimationFrame(frame);
</script>
